faraday_cup:
  # currentCorr = (+/-1)*(currentMHz*scalefactorCurrent+offsetCurrent)
  #
  # wobei: currentMHz =  (FaradayCupScalerDifferenz / integrierteZeitInSekunden) * 1e-6
  # --> Einheit: currentMHz = MHz
  # --> scaleFactor: nA / MHz
  # --> offsetCurrent: nA
  # --> currentCorr: nA
  invert: true # true --> (-1) || false --> (+1)
  scaleFactorCurrent: 3.0962e-03 #1000. # double
  offsetCurrent: -4.3916 #-1.3 # double
